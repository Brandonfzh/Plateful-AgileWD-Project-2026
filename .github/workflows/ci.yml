name: CI

on:
  push:
    branches: [main, add-ci]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      APP_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/test_unit.py -v

  selenium-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      APP_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest selenium

      - name: Run Selenium end-to-end tests
        run: python -m pytest tests/test_selenium.py -v

